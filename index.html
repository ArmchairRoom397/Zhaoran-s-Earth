<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Zhaoran's Earth · 三维地球</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0; overflow: hidden;
      background-color: #000005;
      font-family: 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
      color: #fff; user-select: none;
    }
    canvas { display: block; }

    /* ===== 加载遮罩 ===== */
    #loadingOverlay {
      position: fixed; inset: 0; z-index: 9999;
      background: radial-gradient(circle at 50% 45%, #0a1220 0%, #000005 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 0.6s ease;
    }
    #loadingOverlay.fade-out { opacity: 0; pointer-events: none; }
    #loadingOverlay .loader-globe {
      width: 84px; height: 84px; border-radius: 50%;
      border: 3px solid rgba(74,158,255,0.18);
      border-top-color: #4a9eff;
      animation: spin 1s linear infinite;
      position: relative;
    }
    #loadingOverlay .loader-globe::after {
      content: ''; position: absolute; inset: 10px;
      border-radius: 50%;
      border: 2px solid rgba(74,158,255,0.12);
      border-bottom-color: rgba(74,158,255,0.6);
      animation: spin 1.6s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay .loader-text {
      font-size: 14px; color: #9aaec9; letter-spacing: 1px;
    }
    #loadingOverlay .loader-sub {
      font-size: 11px; color: #55688a; letter-spacing: 0.5px;
      margin-top: -14px;
    }

    .geo-sidebar {
      position: absolute; top: 0; left: 0;
      width: 56px; height: 100vh;
      background: rgba(20, 26, 38, 0.92);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0; z-index: 500; gap: 6px;
    }
    .geo-sidebar .logo {
      width: 40px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px; border-radius: 8px;
      background: linear-gradient(135deg, #2a6fd6, #1b4a9c);
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(42, 111, 214, 0.35);
      flex-shrink: 0;
    }
    .geo-sidebar .side-btn {
      width: 42px; height: 42px; border-radius: 8px;
      border: none; background: transparent; color: #9aaec9;
      font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.18s, color 0.18s;
      position: relative; flex-shrink: 0;
    }
    .geo-sidebar .side-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .geo-sidebar .side-btn.active { background: rgba(58,123,213,0.25); color: #6fb0ff; }
    .geo-sidebar .side-btn .side-tip {
      position: absolute; left: 56px; top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.85); color: #fff;
      padding: 5px 10px; border-radius: 4px; font-size: 12px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
      border: 1px solid rgba(255,255,255,0.1); z-index: 600;
    }
    .geo-sidebar .side-btn:hover .side-tip { opacity: 1; }
    .geo-sidebar .side-sep {
      width: 28px; height: 1px;
      background: rgba(255,255,255,0.08); margin: 6px 0; flex-shrink: 0;
    }

    .geo-brand {
      position: absolute; top: 18px; left: 72px; z-index: 400;
      display: flex; align-items: center; gap: 8px;
      font-size: 18px; font-weight: 600; letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .geo-brand .dot { color: #4a9eff; font-size: 22px; line-height: 1; }

    .geo-settings {
      position: absolute; top: 70px; left: 72px;
      width: 300px;
      background: rgba(20,26,38,0.94);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 36px rgba(0,0,0,0.7);
      z-index: 450; overflow: hidden;
      transition: opacity 0.28s ease;
      max-height: calc(100vh - 90px);
      display: flex; flex-direction: column;
    }
    .geo-settings.hidden { opacity: 0; pointer-events: none; transform: translateX(-110%); }
    .geo-settings .panel-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; font-size: 14px; font-weight: 600;
      color: #e6eefc;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.15);
      cursor: grab;
      flex-shrink: 0;
      user-select: none;
    }
    .geo-settings .panel-title:active { cursor: grabbing; }
    .geo-settings .panel-title .close-x {
      cursor: pointer; font-size: 16px; color: #7a8ba8;
      transition: color 0.15s; line-height: 1;
    }
    .geo-settings .panel-title .close-x:hover { color: #fff; }
    .geo-settings .panel-body { overflow-y: auto; flex: 1; }
    .geo-settings .setting-section {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .geo-settings .setting-section:last-child { border-bottom: none; }
    .geo-settings .section-label {
      font-size: 11px; text-transform: uppercase;
      letter-spacing: 1px; color: #6b7f9e;
      margin-bottom: 10px; font-weight: 600;
    }
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 12px; gap: 10px;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row .row-label {
      font-size: 13px; color: #b8c8e0;
      display: flex; align-items: center; gap: 6px;
      white-space: nowrap; min-width: 62px;
    }
    .setting-row .row-value {
      font-size: 12px; color: #6fb0ff;
      min-width: 48px; text-align: right;
      font-variant-numeric: tabular-nums; font-weight: 500;
    }
    .setting-row input[type="range"] {
      flex: 1; height: 4px;
      accent-color: #3a7bd5; cursor: pointer;
      border-radius: 4px; background: rgba(255,255,255,0.1);
    }
    .btn-toggle-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-toggle-group .tg-btn {
      flex: 1; min-width: 64px; padding: 7px 10px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(50,62,82,0.5);
      color: #b8c8e0; font-size: 12px;
      cursor: pointer; transition: all 0.18s;
      text-align: center; white-space: nowrap;
    }
    .btn-toggle-group .tg-btn:hover {
      background: rgba(70,90,125,0.7);
      border-color: rgba(255,255,255,0.25); color: #fff;
    }
    .btn-toggle-group .tg-btn.active {
      background: #2a6fd6; border-color: #4a9eff;
      color: #fff;
      box-shadow: 0 0 10px rgba(58,123,213,0.35);
    }
    .upload-row { display: flex; align-items: center; gap: 8px; }
    .upload-row .upload-label {
      display: flex; align-items: center; gap: 5px;
      background: rgba(50,62,82,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #cdddf2; padding: 7px 14px;
      border-radius: 6px; font-size: 12px;
      cursor: pointer; transition: background 0.18s;
      white-space: nowrap;
    }
    .upload-row .upload-label:hover { background: rgba(70,90,125,0.8); }
    .upload-row .file-name {
      flex: 1; font-size: 11px; color: #6b7f9e;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(0,0,0,0.25);
      padding: 6px 10px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .upload-row .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: #8a9bb8; padding: 6px 12px;
      border-radius: 5px; font-size: 12px;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .upload-row .reset-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.3); color: #fff;
    }

    .geo-zoom-ctrl {
      position: absolute; right: 16px; bottom: 60px;
      z-index: 400;
      display: flex; flex-direction: row;
      gap: 8px; align-items: center;
    }
    .geo-zoom-ctrl .zoom-btn {
      width: 34px; height: 34px; border-radius: 8px;
      background: rgba(30,38,55,0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cdddf2; font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .geo-zoom-ctrl .zoom-btn:hover { background: rgba(60,80,115,0.95); color: #fff; }

    .mini-globe-wrap {
      width: 92px; height: 92px;
      border-radius: 50%;
      background: #0a0e18;
      border: 2px solid rgba(74,158,255,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 3px 14px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden; position: relative;
      flex-shrink: 0;
    }
    .mini-globe-wrap:hover {
      border-color: rgba(74,158,255,0.9);
      box-shadow: 0 3px 18px rgba(42,111,214,0.6), 0 0 0 1px rgba(74,158,255,0.4);
      transform: scale(1.05);
    }
    .mini-globe-wrap:active { transform: scale(0.96); }
    #miniGlobeCanvas {
      width: 100%; height: 100%;
      display: block; border-radius: 50%;
    }

    .geo-scale-box {
      position: absolute; left: 72px; bottom: 18px;
      z-index: 400; display: flex; align-items: center;
      gap: 14px; pointer-events: none;
    }
    .geo-scale, .geo-level {
      font-size: 11px; color: #9aaec9;
      background: rgba(0,0,0,0.45);
      padding: 4px 12px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      letter-spacing: 0.3px;
    }
    .geo-level .val {
      color: #b8c8e0;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .gpu-mini {
      position: absolute; top: 60px; right: 16px;
      z-index: 400; padding: 4px 10px;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(74,255,128,0.2);
      color: #6bff9a; font-size: 10px;
      font-weight: 500; letter-spacing: 0.3px;
      pointer-events: none; user-select: none;
      max-width: 260px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      transition: opacity 0.3s ease;
    }
    .gpu-mini.hidden { opacity: 0; }

    .geo-settings::-webkit-scrollbar { width: 5px; }
    .geo-settings::-webkit-scrollbar-track { background: transparent; }
    .geo-settings::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12); border-radius: 3px;
    }

    @media (max-width: 900px) {
      .geo-settings { width: calc(100vw - 80px); left: 64px; top: 64px; }
      .geo-brand { top: 14px; left: 64px; font-size: 15px; }
      .gpu-mini { display: none; }
      .geo-zoom-ctrl { bottom: 50px; }
    }
  </style>
</head>
<body>

  <!-- ===== 加载遮罩 ===== -->
  <div id="loadingOverlay">
    <div class="loader-globe"></div>
    <div class="loader-text">正在构建地球…</div>
    <div class="loader-sub" id="loadingSub">初始化渲染引擎</div>
  </div>

  <aside class="geo-sidebar" id="geoSidebar">
    <div class="logo">🌍</div>
    <button class="side-btn" id="btnSideLayers" title="上传地图">
      <span>🗂️</span><span class="side-tip">上传地图</span>
    </button>
    <div class="side-sep"></div>
    <button class="side-btn" id="btnSideSettings" title="设置">
      <span>⚙️</span><span class="side-tip">设置</span>
    </button>
  </aside>

  <div class="geo-brand">
    <span class="dot">🌍</span>
    <span>Zhaoran's Earth</span>
  </div>

  <div class="gpu-mini" id="gpuBadge">⚡ WebGL 已启用</div>

  <div class="geo-settings" id="geoSettings">
    <div class="panel-title" id="settingsPanelTitle">
      <span>⚙️ 显示设置</span>
      <span class="close-x" id="closeSettings">✕</span>
    </div>
    <div class="panel-body">
      <div class="setting-section">
        <div class="section-label">🗺️ 地图纹理</div>
        <div class="upload-row">
          <label for="fileInput" class="upload-label">📁 上传</label>
          <input type="file" id="fileInput" accept="image/*" style="display:none;">
          <span class="file-name" id="fileName">未选择文件</span>
          <button class="reset-btn" id="resetTexture">重置</button>
        </div>
        <div style="font-size: 10px; color: #6b7f9e; margin-top: 8px; line-height: 1.4;">
          💡 支持 16384×8192 高清纹理，缩小不降质
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">💡 光照模式</div>
        <div class="btn-toggle-group">
          <button class="tg-btn active" id="btnLightGlobal">🌐 全局光影</button>
          <button class="tg-btn" id="btnLightSun">☀️ 真实太阳</button>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">☀️ 太阳光照</div>
        <div class="setting-row">
          <span class="row-label">📅 月份</span>
          <input type="range" id="sunMonth" min="1" max="12" step="1" value="6">
          <span class="row-value" id="sunMonthVal">6月</span>
        </div>
        <div class="setting-row">
          <span class="row-label">🕐 时间</span>
          <input type="range" id="sunHour" min="0" max="24" step="0.25" value="12">
          <span class="row-value" id="sunHourVal">12:00</span>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">☁️ 云层</div>
        <div class="setting-row">
          <span class="row-label">显示</span>
          <div class="btn-toggle-group" style="flex:1;">
            <button class="tg-btn active" id="cloudOn">开启</button>
            <button class="tg-btn" id="cloudOff">关闭</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-label">不透明度</span>
          <input type="range" id="cloudOpacity" min="0.1" max="1.0" step="0.05" value="0.6">
          <span class="row-value" id="cloudOpacityVal">0.60</span>
        </div>
        <div class="setting-row">
          <span class="row-label">速度</span>
          <input type="range" id="cloudSpeed" min="0" max="0.002" step="0.0001" value="0.0005">
          <span class="row-value" id="cloudSpeedVal">0.5</span>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">🎯 视角</div>
        <div class="btn-toggle-group">
          <button class="tg-btn" id="btnResetView">重置视角</button>
          <button class="tg-btn" id="btnAutoRotate">自动旋转</button>
        </div>
      </div>
    </div>
  </div>

  <div class="geo-zoom-ctrl">
    <button class="zoom-btn" id="btnZoomIn" title="放大">+</button>
    <button class="zoom-btn" id="btnZoomOut" title="缩小">−</button>
    <div class="mini-globe-wrap" id="miniGlobe" title="点击重置视角">
      <canvas id="miniGlobeCanvas"></canvas>
    </div>
  </div>

  <div class="geo-scale-box">
    <div class="geo-scale" id="geoScale">1,000 公里</div>
    <div class="geo-level">层级：<span class="val" id="statusLevel">2</span></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ==================== 配置 ====================
    const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

    // 移动端下调纹理上限，防 OOM
    const MAX_TEXTURE_SIZE = IS_MOBILE ? 8192 : 16384;
    const MAX_TEXTURE_HEIGHT = IS_MOBILE ? 4096 : 8192;

    const SPHERE_SEGMENTS_W = IS_MOBILE ? 96 : 128;
    const SPHERE_SEGMENTS_H = IS_MOBILE ? 48 : 64;

    const MAX_PIXEL_RATIO = IS_MOBILE ? 1.5 : 2;

    // ==================== 加载遮罩 ====================
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingSub = document.getElementById('loadingSub');
    const LOADING_MIN_MS = 1000;
    const loadingStartTime = performance.now();
    let loadingDone = false;

    const minDelay = new Promise(res => setTimeout(res, LOADING_MIN_MS));
    let resolveResources = null;
    const resourcesReady = new Promise(res => { resolveResources = res; });

    function updateLoadingSub(text) { loadingSub.textContent = text; }

    async function finishLoading() {
      if (loadingDone) return;
      loadingDone = true;
      updateLoadingSub('就绪');
      await Promise.all([minDelay, resourcesReady]);
      loadingOverlay.classList.add('fade-out');
      setTimeout(() => { loadingOverlay.remove(); }, 700);
    }

    // ==================== 场景基础 ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000005);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0005, 5000);
    camera.position.set(0, 0, 3.5);

    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl2', {
      antialias: true, alpha: false, depth: true, stencil: false,
      preserveDrawingBuffer: false, powerPreference: "high-performance",
      failIfMajorPerformanceCaveat: false, desynchronized: true
    }) || canvas.getContext('webgl', { antialias: true, alpha: false, depth: true });

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas, context: gl, antialias: true,
      powerPreference: "high-performance", logarithmicDepthBuffer: false, precision: "highp"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
    renderer.setSize(window.innerWidth, window.innerHeight, false);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';

    function resizeRenderer() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO));
      renderer.setSize(w, h, false);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = false;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    const gpuBadge = document.getElementById('gpuBadge');
    const glContext = renderer.getContext();
    const debugInfo = glContext.getExtension('WEBGL_debug_renderer_info');
    if (debugInfo) {
      try {
        const gpuName = glContext.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
        if (gpuName && typeof gpuName === 'string') {
          gpuBadge.textContent = `⚡ GPU · ${gpuName.length > 26 ? gpuName.substring(0,24)+'…' : gpuName}`;
        }
      } catch (e) { /* 某些浏览器禁止读取，保留默认文案 */ }
    }

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // ==================== 控制器 ====================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.2;
    controls.rotateSpeed = 1.2;
    controls.minDistance = 1.05;
    controls.maxDistance = 8;
    controls.enablePan = false;

    const ROTATE_SPEED_NEAR = 0.12;
    const ROTATE_SPEED_FAR = 1.2;
    const ZOOM_SPEED_NEAR = 0.3;
    const ZOOM_SPEED_FAR = 1.2;

    // ==================== 纹理管理器 ====================
    const textureManager = {
      current: null,
      set(tex) {
        if (tex === this.current) return;
        const old = this.current;
        this.current = tex;
        phongMaterial.map = tex;
        phongMaterial.needsUpdate = true;
        basicMaterial.map = tex;
        basicMaterial.color.setHex(tex ? 0xffffff : 0x1a3a6a);
        basicMaterial.needsUpdate = true;
        miniEarthMaterial.map = tex;
        miniEarthMaterial.color.setHex(tex ? 0xffffff : 0x1a3a6a);
        miniEarthMaterial.needsUpdate = true;
        miniDirty = true; // 纹理变化时刷新小地球
        if (old && old !== tex) {
          try { old.dispose(); } catch (e) {}
        }
      }
    };

    // ==================== 地球几何体 ====================
    const geometry = new THREE.SphereGeometry(
      1,
      SPHERE_SEGMENTS_W, SPHERE_SEGMENTS_H,
      0, Math.PI * 2, 0, Math.PI
    );

    const TEXTURE_URLS = [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_atmos_2048.jpg',
      'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
      'https://raw.githubusercontent.com/mrdoob/three.js/r128/examples/textures/planets/earth_atmos_2048.jpg'
    ];

    const textureLoader = new THREE.TextureLoader();
    textureLoader.setCrossOrigin('anonymous');

    const phongMaterial = new THREE.MeshPhongMaterial({
      map: null, shininess: 6,
      specular: new THREE.Color(0x0d0d1a),
      emissive: new THREE.Color(0x000000)
    });

    const basicMaterial = new THREE.MeshBasicMaterial({
      map: null,
      color: 0x1a3a6a
    });

    function configureTexture(tex, opts = {}) {
      if (!tex) return;
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.minFilter = THREE.LinearMipmapLinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.generateMipmaps = true;
      tex.anisotropy = maxAnisotropy;
      tex.premultiplyAlpha = false;
      tex.unpackAlignment = 1;
      tex.needsUpdate = true;
      return tex;
    }

    function loadTextureWithFallback(urls, onSuccess, onFail, index = 0) {
      if (index >= urls.length) {
        if (onFail) onFail();
        return;
      }
      textureLoader.load(
        urls[index],
        (tex) => {
          configureTexture(tex);
          if (onSuccess) onSuccess(tex);
        },
        undefined,
        () => { loadTextureWithFallback(urls, onSuccess, onFail, index + 1); }
      );

    // ==================== 云层 ====================
    const cloudGeometry = new THREE.SphereGeometry(

    const CLOUD_TEXTURE_URLS = [
      'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/earth_clouds_1024.png',
      'https://threejs.org/examples/textures/planets/earth_clouds_1024.png'

    const cloudMaterialPhong = new THREE.MeshPhongMaterial({
      map: null, transparent: true, opacity: 0.6, alphaTest: 0.01,

      blending: THREE.NormalBlending, depthWrite: false, side: THREE.FrontSide, color: 0xffffff

    // 云纹理：两材质共享同一对象，替换时只 dispose 一次（简化版）

        cloudMaterialPhong.needsUpdate = true;
        cloudMaterialBasic.map = tex;
        cloudMaterialBasic.needsUpdate = true;
        if (old && old !== tex) { try { old.dispose(); } catch (e) {} }
      }, undefined, () => { loadCloudTexture(urlIndex + 1, retriesLeft); });

    loadCloudTexture();

    // ==================== 光照 ====================

      const y = Math.sin(elRad);
      const z = Math.cos(elRad) * Math.sin(azRad);

      const distLight = 8;
      dirLight.position.set(x * distLight, y * distLight, z * distLight);
      dirLight.target.position.set(0, 0, 0);
      dirLight.target.updateMatrixWorld();

    let cloudRotationSpeed = 0.0005;

    document.getElementById('cloudOpacity').addEventListener('input', (e) => {

    // 星空
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = IS_MOBILE ? 8000 : 12000;
    const starsPositions = new Float32Array(starsCount * 3);
    const starsColors = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      const r = 900 + Math.random() * 1400;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      starsPositions[i] = Math.sin(phi) * Math.cos(theta) * r;
      starsPositions[i + 1] = Math.sin(phi) * Math.sin(theta) * r;
      starsPositions[i + 2] = Math.cos(phi) * r;
      const colorVal = 0.75 + Math.random() * 0.25;
      const choice = Math.random();
      if (choice < 0.7) {
        starsColors[i] = colorVal; starsColors[i+1] = colorVal * 0.95; starsColors[i+2] = colorVal;
      } else if (choice < 0.85) {
        starsColors[i] = colorVal * 0.9; starsColors[i+1] = colorVal * 0.9; starsColors[i+2] = colorVal;
      } else {

      }
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
    const starsMaterial = new THREE.PointsMaterial({

    });

    // ==================== 地球实例 ====================

    // ==================== 小地球渲染器 ====================
    const miniCanvas = document.getElementById('miniGlobeCanvas');
    const RENDER_SIZE = 276;
    miniCanvas.width = RENDER_SIZE;
    miniCanvas.height = RENDER_SIZE;

    const MINI_CAMERA_DISTANCE = 5.00;
    const MINI_CAMERA_FOV = 62;

    });

    miniRenderer.outputEncoding = THREE.sRGBEncoding;
    miniRenderer.toneMapping = THREE.NoToneMapping;
    miniRenderer.setClearColor(0x000000, 0);

    const miniEarthMaterial = new THREE.MeshBasicMaterial({ map: null, color: 0x1a3a6a });
    const miniEarth = new THREE.Mesh(geometry, miniEarthMaterial);
    miniScene.add(miniEarth);
    const miniAmbient = new THREE.AmbientLight(0xffffff, 1.0);
    miniScene.add(miniAmbient);

    // ==================== 小地球脏标记与节流状态 ====================
    // 相机姿态变化时置脏；纹理/光照变化时也置脏。节流按时间而非帧数。
    let miniDirty = true;
    const MINI_TARGET_INTERVAL = 1 / 30; // 30fps 上限
    let miniAccum = 0;

    controls.addEventListener('change', () => { miniDirty = true; });

    // ==================== 加载主纹理 ====================
    loadTextureWithFallback(
      TEXTURE_URLS,
      (tex) => {
        textureManager.set(tex);
        updateLoadingSub('主纹理已就绪');
        resolveResources();
      },
      () => {
        // 网络失败：生成渐变占位纹理
        const cv = document.createElement('canvas');
        cv.width = 1024; cv.height = 512;
        const ctx = cv.getContext('2d');
        const grad = ctx.createLinearGradient(0, 0, 0, 512);
        grad.addColorStop(0, '#1a3a6a');
        grad.addColorStop(0.5, '#2a6fa6');
        grad.addColorStop(1, '#1a3a6a');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1024, 512);
        const tex = new THREE.CanvasTexture(cv);
        configureTexture(tex);
        textureManager.set(tex);
        updateLoadingSub('使用占位纹理');

    );

    // ==================== 上传处理 ====================
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const resetBtn = document.getElementById('resetTexture');

    function prepareEquirectangularTexture(image, imgWidth, imgHeight) {
      const expectedRatio = 2;
      const actualRatio = imgWidth / imgHeight;
      let sourceX = 0, sourceY = 0, sourceW = imgWidth, sourceH = imgHeight;
      if (Math.abs(actualRatio - expectedRatio) > 0.01) {
        if (actualRatio > expectedRatio) {
          sourceW = imgHeight * expectedRatio;
          sourceX = (imgWidth - sourceW) / 2;
        } else {
          sourceH = imgWidth / expectedRatio;
          sourceY = (imgHeight - sourceH) / 2;
        }
      }
      let outW = Math.round(sourceW);
      let outH = Math.round(sourceH);
      if (outW > MAX_TEXTURE_SIZE || outH > MAX_TEXTURE_HEIGHT) {
        const scale = Math.min(MAX_TEXTURE_SIZE / outW, MAX_TEXTURE_HEIGHT / outH);
        outW = Math.floor(outW * scale);
        outH = Math.floor(outH * scale);
      }
      const cv = document.createElement('canvas');
      cv.width = outW;
      cv.height = outH;
      const ctx = cv.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(image, sourceX, sourceY, sourceW, sourceH, 0, 0, outW, outH);
      return cv;
    }

    function processImageSource(source, w, h, displayName) {
      try {
        const cv = prepareEquirectangularTexture(source, w, h);
        const newTexture = new THREE.CanvasTexture(cv);
        configureTexture(newTexture);
        newTexture.encoding = THREE.sRGBEncoding;
        newTexture.needsUpdate = true;
        textureManager.set(newTexture);
        fileNameDisplay.textContent = displayName;
      } catch (err) {
        console.error('纹理处理失败', err);
        fileNameDisplay.textContent = '处理失败，请重试';
      }
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const displayName = file.name.length > 20 ? file.name.substring(0, 18) + '...' : file.name;
      fileNameDisplay.textContent = '处理中...';

      if (window.createImageBitmap) {
        createImageBitmap(file, { imageOrientation: 'none', premultiplyAlpha: 'none', colorSpaceConversion: 'none' })
          .then(bitmap => {
            processImageSource(bitmap, bitmap.width, bitmap.height, displayName);
            bitmap.close();
          })
          .catch(() => {
            const reader = new FileReader();
            reader.onload = (e) => {
              const img = new Image();
              img.onload = () => processImageSource(img, img.width, img.height, displayName);
              img.onerror = () => { fileNameDisplay.textContent = '图片解码失败'; };
              img.src = e.target.result;
            };
            reader.onerror = () => { fileNameDisplay.textContent = '文件读取失败'; };
            reader.readAsDataURL(file);
          });
      } else {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => processImageSource(img, img.width, img.height, displayName);
          img.onerror = () => { fileNameDisplay.textContent = '图片解码失败'; };
          img.src = e.target.result;
        };
        reader.onerror = () => { fileNameDisplay.textContent = '文件读取失败'; };
        reader.readAsDataURL(file);
      }
    });

    resetBtn.addEventListener('click', () => {
      fileNameDisplay.textContent = '加载中...';
      loadTextureWithFallback(
        TEXTURE_URLS,
        (tex) => {
          textureManager.set(tex);
          fileInput.value = '';
          fileNameDisplay.textContent = '未选择文件';
        },
        () => { fileNameDisplay.textContent = '默认纹理不可用'; }
      );
    });

    // ==================== 视角控制 ====================
    const btnResetView = document.getElementById('btnResetView');
    const btnAutoRotate = document.getElementById('btnAutoRotate');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const miniGlobe = document.getElementById('miniGlobe');

    let autoRotateEnabled = false;
    const LON_OFFSET = 145;
    const TARGET_LAT = 35;
    const TARGET_LON = 105;
    const VIEW_DISTANCE = 3.5;

    function resetView() {
      if (autoRotateEnabled) {
        autoRotateEnabled = false;
        controls.autoRotate = false;
        btnAutoRotate.classList.remove('active');
      }
      const latRad = THREE.MathUtils.degToRad(TARGET_LAT);
      const lonRad = THREE.MathUtils.degToRad(TARGET_LON + LON_OFFSET);
      const x = Math.cos(latRad) * Math.cos(lonRad) * VIEW_DISTANCE;
      const y = Math.sin(latRad) * VIEW_DISTANCE;
      const z = Math.cos(latRad) * Math.sin(lonRad) * VIEW_DISTANCE;
      camera.position.set(x, y, z);
      controls.target.set(0, 0, 0);
      controls.update();
      miniDirty = true;
    }
    resetView();

    btnResetView.addEventListener('click', resetView);
    miniGlobe.addEventListener('click', resetView);

    btnAutoRotate.addEventListener('click', () => {
      autoRotateEnabled = !autoRotateEnabled;
      controls.autoRotate = autoRotateEnabled;
      controls.autoRotateSpeed = 0.8;
      btnAutoRotate.classList.toggle('active', autoRotateEnabled);
    });

    btnZoomIn.addEventListener('click', () => {
      const dist = camera.position.length();
      const newDist = Math.max(controls.minDistance, dist * 0.85);
      camera.position.normalize().multiplyScalar(newDist);
      controls.update();
    });
    btnZoomOut.addEventListener('click', () => {
      const dist = camera.position.length();
      const newDist = Math.min(controls.maxDistance, dist * 1.15);
      camera.position.normalize().multiplyScalar(newDist);

    // ==================== 面板 ====================
    const geoSettings = document.getElementById('geoSettings');
    const closeSettings = document.getElementById('closeSettings');
    const btnSideSettings = document.getElementById('btnSideSettings');
    const settingsPanelTitle = document.getElementById('settingsPanelTitle');

    function toggleSettings() {

      if (isHidden) gpuBadge.classList.add('hidden');
      else gpuBadge.classList.remove('hidden');
    }
    closeSettings.addEventListener('click', toggleSettings);
    btnSideSettings.addEventListener('click', toggleSettings);

    (function makePanelDraggable() {
      let isDragging = false;
      let startX = 0, startY = 0;
      let startLeft = 0, startTop = 0;

      settingsPanelTitle.addEventListener('mousedown', (e) => {
        if (e.target === closeSettings || e.target.closest('.close-x')) return;
        isDragging = true;
        startX = e.clientX; startY = e.clientY;
        const rect = geoSettings.getBoundingClientRect();
        startLeft = rect.left; startTop = rect.top;
        geoSettings.style.right = 'auto';
        geoSettings.style.left = startLeft + 'px';
        geoSettings.style.top = startTop + 'px';
        geoSettings.style.transition = 'none';
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX; const dy = e.clientY - startY;
        let newLeft = startLeft + dx; let newTop = startTop + dy;
        const panelWidth = geoSettings.offsetWidth; const panelHeight = geoSettings.offsetHeight;
        newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - panelWidth));
        newTop = Math.max(0, Math.min(newTop, window.innerHeight - panelHeight));
        geoSettings.style.left = newLeft + 'px'; geoSettings.style.top = newTop + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) { isDragging = false; geoSettings.style.transition = ''; }
      });
    })();

    document.getElementById('btnSideLayers').addEventListener('click', () => fileInput.click());

    // ==================== 比例尺（真实换算估算） ====================
    // 可视高度 = 2 * dist * tan(fov/2)，单位与地球半径(1)同；
    // 地球周长 ≈ 40075 公里 → 每单位 ≈ 40075 / (2π) ≈ 6378.1 公里。
    const EARTH_KM_PER_UNIT = 40075 / (2 * Math.PI);

    function updateScale() {
      const dist = camera.position.length();
      const visibleHeightUnits = 2 * dist * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const visibleKm = visibleHeightUnits * EARTH_KM_PER_UNIT;
      // 取一个好看的刻度：可见高度的 1/5 左右，圆整到 1/2/5 × 10^n
      const raw = visibleKm / 5;
      const pow = Math.pow(10, Math.floor(Math.log10(Math.max(raw, 1))));
      const nice = [1, 2, 5, 10].map(m => m * pow).find(v => v >= raw) || raw;
      document.getElementById('geoScale').textContent = `${Math.round(nice).toLocaleString()} 公里`;

      const level = Math.max(1, Math.round((8 - dist) * 2));
      document.getElementById('statusLevel').textContent = level;
    }

    // ==================== 小地球更新 ====================
    function updateMiniGlobe() {
      const dir = camera.position.clone().normalize();
      if (dir.length() < 0.01) dir.set(0, 0, 1);

      miniCamera.position.copy(dir.multiplyScalar(MINI_CAMERA_DISTANCE));
      miniCamera.fov = MINI_CAMERA_FOV;
      miniCamera.aspect = 1;
      miniCamera.near = 0.1;
      miniCamera.far = 20;
      miniCamera.updateProjectionMatrix();
      miniCamera.lookAt(0, 0, 0);
      miniRenderer.render(miniScene, miniCamera);
    }

    // ==================== 动画 ====================
    const clock = new THREE.Clock();
    let lastDelta = 0.016;

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      lastDelta = delta;

      const dist = camera.position.length();
      const minD = controls.minDistance;
      const maxD = controls.maxDistance;
      const s = Math.max(0, Math.min(1, (dist - minD) / (maxD - minD)));
      controls.rotateSpeed = ROTATE_SPEED_NEAR + s * (ROTATE_SPEED_FAR - ROTATE_SPEED_NEAR);
      controls.zoomSpeed = ZOOM_SPEED_NEAR + s * (ZOOM_SPEED_FAR - ZOOM_SPEED_NEAR);

      if (cloudEnabled && clouds.visible) {
        clouds.rotation.y += cloudRotationSpeed * (delta * 60);
      }
      stars.rotation.y += 0.0006 * (delta * 60);

      if (sunHalo1.visible) {
        const pulse = 1 + Math.sin(Date.now() * 0.0015) * 0.03;
        sunHalo1.scale.set(pulse, pulse, pulse);
        sunHalo2.scale.set(pulse * 0.99, pulse * 0.99, pulse * 0.99);
        sunHalo3.scale.set(pulse * 0.98, pulse * 0.98, pulse * 0.98);
      }

      if (lightMode === 'sun') starsMaterial.opacity = originalStarsOpacity * 0.75;
      else starsMaterial.opacity = originalStarsOpacity;

      controls.update();
      updateScale();

      renderer.render(scene, camera);

      // ---- 小地球：按时间节流 + 脏标记跳过 ----
      miniAccum += delta;
      if (miniAccum >= MINI_TARGET_INTERVAL) {
        // delta 异常大（切标签页回来）时清零，避免连画多次
        miniAccum = miniAccum >= MINI_TARGET_INTERVAL * 2 ? 0 : miniAccum - MINI_TARGET_INTERVAL;
        if (miniDirty || controls.autoRotate) {
          updateMiniGlobe();
          miniDirty = false;
        }
      }
    }

    // ==================== 启动 ====================
    setLightMode('global');
    updateSunPosition();
    animate();

    setTimeout(() => { resolveResources(); finishLoading(); }, 2500);
    resourcesReady.then(finishLoading);

    window.addEventListener('resize', () => { resizeRenderer(); });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zhaoran's Earth · 三维地球（手机分格加载优化版）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      margin: 0; overflow: hidden;
      background-color: #000005;
      font-family: 'Segoe UI', 'Microsoft YaHei', Roboto, sans-serif;
      color: #fff; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; }

    /* ===== 左侧导航栏（移动端适配） ===== */
    .geo-sidebar {
      position: absolute; top: 0; left: 0;
      width: 48px; height: 100vh;
      background: rgba(20, 26, 38, 0.92);
      backdrop-filter: blur(16px);
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 0; z-index: 500; gap: 4px;
    }
    .geo-sidebar .logo {
      width: 36px; height: 36px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 10px; border-radius: 8px;
      background: linear-gradient(135deg, #2a6fd6, #1b4a9c);
      font-size: 18px;
      box-shadow: 0 4px 14px rgba(42, 111, 214, 0.35);
      flex-shrink: 0;
    }
    .geo-sidebar .side-btn {
      width: 38px; height: 38px; border-radius: 8px;
      border: none; background: transparent; color: #9aaec9;
      font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.18s, color 0.18s;
      position: relative; flex-shrink: 0;
    }
    .geo-sidebar .side-btn:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .geo-sidebar .side-btn.active { background: rgba(58,123,213,0.25); color: #6fb0ff; }
    .geo-sidebar .side-btn .side-tip {
      position: absolute; left: 50px; top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.85); color: #fff;
      padding: 4px 8px; border-radius: 4px; font-size: 11px;
      white-space: nowrap; opacity: 0; pointer-events: none;
      transition: opacity 0.15s;
      border: 1px solid rgba(255,255,255,0.1); z-index: 600;
    }
    .geo-sidebar .side-btn:hover .side-tip { opacity: 1; }
    .geo-sidebar .side-sep {
      width: 24px; height: 1px;
      background: rgba(255,255,255,0.08); margin: 4px 0; flex-shrink: 0;
    }

    /* ===== 左上角品牌 ===== */
    .geo-brand {
      position: absolute; top: 14px; left: 60px; z-index: 400;
      display: flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 600; letter-spacing: 0.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .geo-brand .dot { color: #4a9eff; font-size: 18px; line-height: 1; }

    /* ===== 设置面板（移动端适配） ===== */
    .geo-settings {
      position: absolute; top: 58px; left: 60px;
      width: calc(100vw - 76px); max-width: 340px;
      background: rgba(20,26,38,0.96);
      backdrop-filter: blur(20px);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 8px 36px rgba(0,0,0,0.7);
      z-index: 450; overflow: hidden;
      transition: opacity 0.28s ease, transform 0.28s ease;
      max-height: calc(100vh - 120px);
      display: flex; flex-direction: column;
    }
    .geo-settings.hidden { opacity: 0; pointer-events: none; transform: translateX(-110%); }
    .geo-settings .panel-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; font-size: 13px; font-weight: 600;
      color: #e6eefc;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.15);
      cursor: grab; flex-shrink: 0; user-select: none;
    }
    .geo-settings .panel-title:active { cursor: grabbing; }
    .geo-settings .panel-title .close-x {
      cursor: pointer; font-size: 15px; color: #7a8ba8;
      transition: color 0.15s; line-height: 1;
      padding: 4px;
    }
    .geo-settings .panel-title .close-x:hover { color: #fff; }
    .geo-settings .panel-body {
      overflow-y: auto; flex: 1;
    }
    .geo-settings .setting-section {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .geo-settings .setting-section:last-child { border-bottom: none; }
    .geo-settings .section-label {
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 1px; color: #6b7f9e;
      margin-bottom: 8px; font-weight: 600;
    }
    .setting-row {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 10px; gap: 8px;
      flex-wrap: wrap;
    }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row .row-label {
      font-size: 12px; color: #b8c8e0;
      display: flex; align-items: center; gap: 4px;
      white-space: nowrap; min-width: 52px;
    }
    .setting-row .row-value {
      font-size: 11px; color: #6fb0ff;
      min-width: 42px; text-align: right;
      font-variant-numeric: tabular-nums; font-weight: 500;
    }
    .setting-row input[type="range"] {
      flex: 1; height: 4px;
      accent-color: #3a7bd5; cursor: pointer;
      border-radius: 4px; background: rgba(255,255,255,0.1);
    }
    .btn-toggle-group { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-toggle-group .tg-btn {
      flex: 1; min-width: 56px; padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(50,62,82,0.5);
      color: #b8c8e0; font-size: 11px;
      cursor: pointer; transition: all 0.18s;
      text-align: center; white-space: nowrap;
    }
    .btn-toggle-group .tg-btn:hover {
      background: rgba(70,90,125,0.7);
      border-color: rgba(255,255,255,0.25); color: #fff;
    }
    .btn-toggle-group .tg-btn.active {
      background: #2a6fd6; border-color: #4a9eff;
      color: #fff;
      box-shadow: 0 0 10px rgba(58,123,213,0.35);
    }
    .upload-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .upload-row .upload-label {
      display: flex; align-items: center; gap: 4px;
      background: rgba(50,62,82,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #cdddf2; padding: 6px 12px;
      border-radius: 6px; font-size: 11px;
      cursor: pointer; transition: background 0.18s;
      white-space: nowrap;
    }
    .upload-row .upload-label:hover { background: rgba(70,90,125,0.8); }
    .upload-row .file-name {
      flex: 1; font-size: 10px; color: #6b7f9e;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap;
      background: rgba(0,0,0,0.25);
      padding: 5px 8px; border-radius: 5px;
      border: 1px solid rgba(255,255,255,0.05);
      min-width: 60px;
    }
    .upload-row .reset-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: #8a9bb8; padding: 5px 10px;
      border-radius: 5px; font-size: 11px;
      cursor: pointer; transition: all 0.15s;
      white-space: nowrap;
    }
    .upload-row .reset-btn:hover {
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.3); color: #fff;
    }

    /* ===== 右下角控件（移动端适配） ===== */
    .geo-zoom-ctrl {
      position: absolute; right: 12px; bottom: 50px;
      z-index: 400;
      display: flex; flex-direction: row;
      gap: 6px; align-items: center;
    }
    .geo-zoom-ctrl .zoom-btn {
      width: 32px; height: 32px; border-radius: 8px;
      background: rgba(30,38,55,0.88);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.1);
      color: #cdddf2; font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .geo-zoom-ctrl .zoom-btn:hover { background: rgba(60,80,115,0.95); color: #fff; }

    /* ===== 实时缩略图 ===== */
    .mini-globe-wrap {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #0a0e18;
      border: 2px solid rgba(74,158,255,0.4);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      box-shadow: 0 3px 14px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden; position: relative;
      flex-shrink: 0;
    }
    .mini-globe-wrap:hover {
      border-color: rgba(74,158,255,0.9);
      box-shadow: 0 3px 18px rgba(42,111,214,0.6), 0 0 0 1px rgba(74,158,255,0.4);
      transform: scale(1.05);
    }
    .mini-globe-wrap:active { transform: scale(0.96); }
    #miniGlobeCanvas {
      width: 100%; height: 100%;
      display: block; border-radius: 50%;
    }

    /* ===== 左下角比例尺 + 层级 ===== */
    .geo-scale-box {
      position: absolute; left: 60px; bottom: 14px;
      z-index: 400; display: flex; align-items: center;
      gap: 8px; pointer-events: none;
      flex-wrap: wrap;
    }
    .geo-scale, .geo-level {
      font-size: 10px; color: #9aaec9;
      background: rgba(0,0,0,0.45);
      padding: 3px 8px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.08);
      letter-spacing: 0.3px;
    }
    .geo-level .val {
      color: #b8c8e0;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    /* GPU 角标 */
    .gpu-mini {
      position: absolute; top: 52px; right: 12px;
      z-index: 400; padding: 3px 8px;
      border-radius: 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(74,255,128,0.2);
      color: #6bff9a; font-size: 9px;
      font-weight: 500; letter-spacing: 0.3px;
      pointer-events: none; user-select: none;
      max-width: 200px; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      transition: opacity 0.3s ease;
      display: none;
    }
    .gpu-mini.hidden { opacity: 0; }

    .geo-settings::-webkit-scrollbar { width: 4px; }
    .geo-settings::-webkit-scrollbar-track { background: transparent; }
    .geo-settings::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.12); border-radius: 3px;
    }

    /* 移动端横屏优化 */
    @media (max-height: 500px) {
      .geo-settings { max-height: calc(100vh - 90px); top: 50px; }
      .geo-brand { font-size: 13px; top: 10px; }
      .geo-zoom-ctrl { bottom: 40px; }
      .mini-globe-wrap { width: 64px; height: 64px; }
    }
  </style>
</head>
<body>

  <aside class="geo-sidebar" id="geoSidebar">
    <div class="logo">🌍</div>
    <button class="side-btn" id="btnSideLayers" title="上传地图">
      <span>🗂️</span><span class="side-tip">上传地图</span>
    </button>
    <div class="side-sep"></div>
    <button class="side-btn" id="btnSideSettings" title="设置">
      <span>⚙️</span><span class="side-tip">设置</span>
    </button>
  </aside>

  <div class="geo-brand">
    <span class="dot">🌍</span>
    <span>Zhaoran's Earth</span>
  </div>

  <div class="gpu-mini" id="gpuBadge">⚡ GPU 加速已启用</div>

  <!-- 设置面板 -->
  <div class="geo-settings hidden" id="geoSettings">
    <div class="panel-title" id="settingsPanelTitle">
      <span>⚙️ 显示设置</span>
      <span class="close-x" id="closeSettings">✕</span>
    </div>
    <div class="panel-body">
      <div class="setting-section">
        <div class="section-label">🗺️ 地图纹理</div>
        <div class="upload-row">
          <label for="fileInput" class="upload-label">📁 上传</label>
          <input type="file" id="fileInput" accept="image/*" style="display:none;">
          <span class="file-name" id="fileName">未选择文件</span>
          <button class="reset-btn" id="resetTexture">重置</button>
        </div>
        <div style="font-size: 9px; color: #6b7f9e; margin-top: 6px; line-height: 1.3;">
          💡 推荐 4096×2048 或更高，自动适配比例
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">💡 光照模式</div>
        <div class="btn-toggle-group">
          <button class="tg-btn active" id="btnLightGlobal">🌐 全局光影</button>
          <button class="tg-btn" id="btnLightSun">☀️ 真实太阳</button>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">☀️ 太阳光照</div>
        <div class="setting-row">
          <span class="row-label">📅 月份</span>
          <input type="range" id="sunMonth" min="1" max="12" step="1" value="6">
          <span class="row-value" id="sunMonthVal">6月</span>
        </div>
        <div class="setting-row">
          <span class="row-label">🕐 时间</span>
          <input type="range" id="sunHour" min="0" max="24" step="0.25" value="12">
          <span class="row-value" id="sunHourVal">12:00</span>
        </div>
        <div class="setting-row">
          <span class="row-label">💡 亮度</span>
          <input type="range" id="lightIntensity" min="0" max="2.5" step="0.05" value="1.0">
          <span class="row-value" id="lightIntensityVal">1.00</span>
        </div>
        <div class="setting-row">
          <span class="row-label">🌟 泛光</span>
          <input type="range" id="bloomStrength" min="0" max="1.5" step="0.02" value="0.55">
          <span class="row-value" id="bloomStrengthVal">0.55</span>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">☁️ 云层</div>
        <div class="setting-row">
          <span class="row-label">显示</span>
          <div class="btn-toggle-group" style="flex:1;">
            <button class="tg-btn active" id="cloudOn">开启</button>
            <button class="tg-btn" id="cloudOff">关闭</button>
          </div>
        </div>
        <div class="setting-row">
          <span class="row-label">速度</span>
          <input type="range" id="cloudSpeed" min="0" max="0.002" step="0.0001" value="0.0005">
          <span class="row-value" id="cloudSpeedVal">0.5</span>
        </div>
      </div>

      <div class="setting-section">
        <div class="section-label">🎯 视角</div>
        <div class="btn-toggle-group">
          <button class="tg-btn" id="btnResetView">重置视角</button>
          <button class="tg-btn" id="btnAutoRotate">自动旋转</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 右下角控件 -->
  <div class="geo-zoom-ctrl">
    <button class="zoom-btn" id="btnZoomIn" title="放大">+</button>
    <button class="zoom-btn" id="btnZoomOut" title="缩小">−</button>
    <div class="mini-globe-wrap" id="miniGlobe" title="点击重置视角">
      <canvas id="miniGlobeCanvas"></canvas>
    </div>
  </div>

  <div class="geo-scale-box">
    <div class="geo-scale" id="geoScale">1,000 公里</div>
    <div class="geo-level">层级：<span class="val" id="statusLevel">2</span></div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

    // ==================== 移动端性能优化配置 ====================
    const IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    
    // 移动端降采样，减少球体细分，提升性能
    const SPHERE_SEGMENTS = IS_MOBILE ? 512 : 1024;   // 移动端降低到512
    const SUPERSAMPLE_FACTOR = IS_MOBILE ? 1.0 : 1.3;  // 移动端不超采样
    const MINI_SIZE = IS_MOBILE ? 128 : 256;           // 缩略图减小
    const STAR_COUNT = IS_MOBILE ? 6000 : 12000;       // 星星减少
    
    // 分格加载：将纹理分成 2x1 或 4x2 块逐步加载（这里用更轻量的方案：延迟加载 + 按需渲染）
    // 但为了真正的“分格”，我们使用 Canvas 切片 + 渐进式纹理更新，但 Three.js 纹理不支持直接分块。
    // 替代方案：降低初始纹理分辨率，等加载完成后再替换为高清。同时限制纹理最大尺寸。
    const MAX_TEXTURE_SIZE = IS_MOBILE ? 4096 : 8192;   // 移动端限制纹理最大边长为 4096

    // ==================== 场景基础 ====================
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000005);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.0005, 5000);
    camera.position.set(0, 0, 3.5);

    const canvas = document.createElement('canvas');
    const gl = canvas.getContext('webgl2', {
      antialias: false, alpha: false, depth: true, stencil: false,
      preserveDrawingBuffer: false, powerPreference: "high-performance",
      failIfMajorPerformanceCaveat: false, desynchronized: true
    });

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas, context: gl, antialias: false,
      powerPreference: "high-performance", logarithmicDepthBuffer: false, precision: "highp"
    });

    renderer.setSize(window.innerWidth, window.innerHeight);

    function resizeRenderer() {
      const baseWidth = window.innerWidth;
      const baseHeight = window.innerHeight;
      const renderWidth = Math.floor(baseWidth * SUPERSAMPLE_FACTOR);
      const renderHeight = Math.floor(baseHeight * SUPERSAMPLE_FACTOR);
      const canvas = renderer.domElement;
      canvas.width = renderWidth;
      canvas.height = renderHeight;
      canvas.style.width = baseWidth + 'px';
      canvas.style.height = baseHeight + 'px';
      renderer.setPixelRatio(1);
      camera.aspect = baseWidth / baseHeight;
      camera.updateProjectionMatrix();
      if (composer) {
        composer.setSize(baseWidth, baseHeight);
      }
      if (fxaaPass) {
        const pixelRatio = renderer.getPixelRatio();
        fxaaPass.material.uniforms['resolution'].value.x = 1 / (baseWidth * pixelRatio);
        fxaaPass.material.uniforms['resolution'].value.y = 1 / (baseHeight * pixelRatio);
      }
    }

    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.physicallyCorrectLights = false;
    renderer.toneMapping = THREE.NoToneMapping;
    document.body.appendChild(renderer.domElement);

    const gpuBadge = document.getElementById('gpuBadge');
    const glContext = renderer.getContext();
    const isWebGL2 = renderer.capabilities.isWebGL2;
    const debugInfo = glContext.getExtension('WEBGL_debug_renderer_info');
    if (debugInfo) {
      const gpuName = glContext.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
      gpuBadge.textContent = `⚡ GPU · ${gpuName.length > 26 ? gpuName.substring(0,24)+'…' : gpuName}`;
    }

    const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

    // ==================== 后处理：泛光（仅真实太阳模式启用） ====================
    let composer = null;
    let bloomPass = null;
    let fxaaPass = null;
    let usePostProcessing = false;

    function initPostProcessing() {
      const renderScene = new RenderPass(scene, camera);
      bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.55,
        0.75,
        0.0
      );
      bloomPass.threshold = 0.0;
      bloomPass.strength = 0.55;
      bloomPass.radius = 0.75;

      composer = new EffectComposer(renderer);
      composer.addPass(renderScene);
      composer.addPass(bloomPass);

      fxaaPass = new ShaderPass(FXAAShader);
      const pixelRatio = renderer.getPixelRatio();
      fxaaPass.material.uniforms['resolution'].value.x = 1 / (window.innerWidth * pixelRatio);
      fxaaPass.material.uniforms['resolution'].value.y = 1 / (window.innerHeight * pixelRatio);
      composer.addPass(fxaaPass);
    }
    initPostProcessing();

    // ==================== 控制器 ====================
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = false;
    controls.enableZoom = true;
    controls.zoomSpeed = 1.2;
    controls.rotateSpeed = 1.2;
    controls.minDistance = 1.05;
    controls.maxDistance = 8;
    controls.enablePan = false;

    const ROTATE_SPEED_NEAR = 0.12;
    const ROTATE_SPEED_FAR = 1.2;
    const ZOOM_SPEED_NEAR = 0.3;
    const ZOOM_SPEED_FAR = 1.2;

    // ==================== 地球几何体 ====================
    const geometry = new THREE.SphereGeometry(1, SPHERE_SEGMENTS, SPHERE_SEGMENTS, 0, Math.PI * 2, 0, Math.PI);

    // 移动端使用更小的默认纹理，减少内存和带宽
    const DEFAULT_TEXTURE_URL = IS_MOBILE 
      ? 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg' 
      : './earth_atmos_2048.jpg';
    const FALLBACK_TEXTURE_URL = 'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg';

    const textureLoader = new THREE.TextureLoader();

    const phongMaterial = new THREE.MeshPhongMaterial({
      map: null, shininess: 6,
      specular: new THREE.Color(0x0d0d1a),
      emissive: new THREE.Color(0x000000)
    });

    const basicMaterial = new THREE.MeshBasicMaterial({ map: null });

    let currentMaterial = basicMaterial;
    let currentTexture = null;

    // 配置纹理，移动端限制尺寸并关闭 mipmap 如果太大
    function configureTexture(tex) {
      if (!tex) return;
      tex.encoding = THREE.sRGBEncoding;
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.magFilter = THREE.LinearFilter;
      
      // 移动端或大纹理使用 LinearFilter + 关闭 mipmap 以减少内存
      if (IS_MOBILE || (tex.image && (tex.image.width > 2048 || tex.image.height > 1024))) {
        tex.minFilter = THREE.LinearFilter;
        tex.generateMipmaps = false;
      } else {
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.generateMipmaps = true;
      }
      
      tex.anisotropy = IS_MOBILE ? Math.min(4, maxAnisotropy) : maxAnisotropy;
      tex.premultiplyAlpha = false;
      tex.unpackAlignment = 1;
      tex.format = THREE.RGBAFormat;
      return tex;
    }

    function loadDefaultTexture(onSuccess) {
      // 移动端优先加载较小纹理
      const primaryUrl = IS_MOBILE ? FALLBACK_TEXTURE_URL : DEFAULT_TEXTURE_URL;
      textureLoader.load(primaryUrl, (tex) => {
        // 如果移动端且图片过大，进行降采样
        if (IS_MOBILE && tex.image && (tex.image.width > MAX_TEXTURE_SIZE || tex.image.height > MAX_TEXTURE_SIZE/2)) {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const scale = Math.min(MAX_TEXTURE_SIZE / tex.image.width, (MAX_TEXTURE_SIZE/2) / tex.image.height);
          const newW = Math.floor(tex.image.width * scale);
          const newH = Math.floor(tex.image.height * scale);
          canvas.width = newW;
          canvas.height = newH;
          ctx.drawImage(tex.image, 0, 0, newW, newH);
          const newTex = new THREE.CanvasTexture(canvas);
          configureTexture(newTex);
          newTex.encoding = THREE.sRGBEncoding;
          if (onSuccess) onSuccess(newTex);
          tex.dispose();
        } else {
          configureTexture(tex);
          if (onSuccess) onSuccess(tex);
        }
      }, undefined, () => {
        textureLoader.load(FALLBACK_TEXTURE_URL, (tex) => {
          if (IS_MOBILE && tex.image && (tex.image.width > MAX_TEXTURE_SIZE || tex.image.height > MAX_TEXTURE_SIZE/2)) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const scale = Math.min(MAX_TEXTURE_SIZE / tex.image.width, (MAX_TEXTURE_SIZE/2) / tex.image.height);
            const newW = Math.floor(tex.image.width * scale);
            const newH = Math.floor(tex.image.height * scale);
            canvas.width = newW;
            canvas.height = newH;
            ctx.drawImage(tex.image, 0, 0, newW, newH);
            const newTex = new THREE.CanvasTexture(canvas);
            configureTexture(newTex);
            newTex.encoding = THREE.sRGBEncoding;
            if (onSuccess) onSuccess(newTex);
            tex.dispose();
          } else {
            configureTexture(tex);
            if (onSuccess) onSuccess(tex);
          }
        }, undefined, () => {
          if (onSuccess) onSuccess(null);
        });
      });
    }

    loadDefaultTexture((tex) => {
      if (tex) {
        phongMaterial.map = tex;
        phongMaterial.needsUpdate = true;
        basicMaterial.map = tex;
        basicMaterial.needsUpdate = true;
        currentTexture = tex;

    const earth = new THREE.Mesh(geometry, currentMaterial);

    // ==================== 云层（移动端使用更低分辨率） ====================

    const CLOUD_TEXTURE_2048 = 'https://threejs.org/examples/textures/planets/earth_clouds_2048.png';
    const CLOUD_TEXTURE_1024 = 'https://threejs.org/examples/textures/planets/earth_clouds_1024.png';

    const cloudMaterialPhong = new THREE.MeshPhongMaterial({

      textureLoader.load(url, 
        (tex) => {
          tex.encoding = THREE.sRGBEncoding;
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;

          tex.generateMipmaps = false;

        }, undefined, () => {

          textureLoader.load(CLOUD_TEXTURE_1024, (tex) => {
            tex.encoding = THREE.sRGBEncoding;
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.minFilter = THREE.LinearFilter;

            tex.anisotropy = IS_MOBILE ? 2 : maxAnisotropy;

    // ==================== 光照 ====================

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);

    // ==================== 太阳 ====================
    const SUN_DISTANCE = 500;

    const sunCoreGeometry = new THREE.SphereGeometry(SUN_RADIUS, IS_MOBILE ? 32 : 64, IS_MOBILE ? 32 : 64);

    function updateSunPosition() {
      const declination = 23.44 * Math.sin(((sunMonth - 3) / 12) * Math.PI * 2);
      const hourAngle = (sunHour - 12) * 15;
      const azRad = THREE.MathUtils.degToRad(hourAngle);
      const elRad = THREE.MathUtils.degToRad(declination);
      const x = Math.cos(elRad) * Math.cos(azRad);
      const y = Math.sin(elRad);
      const z = Math.cos(elRad) * Math.sin(azRad);
      
      const distLight = 8;
      dirLight.position.set(x * distLight, y * distLight, z * distLight);
      dirLight.target.position.set(0, 0, 0);
      dirLight.target.updateMatrixWorld();
      
      const sunPos = new THREE.Vector3(x, y, z).multiplyScalar(SUN_DISTANCE);
      sunObjects.forEach(obj => obj.position.copy(sunPos));

    let lightMode = 'global';

      } else {

    document.getElementById('btnLightGlobal').addEventListener('click', () => setLightMode('global'));
    document.getElementById('btnLightSun').addEventListener('click', () => setLightMode('sun'));
    setLightMode('global');
    updateSunPosition();

    // 云层控制
    const cloudOnBtn = document.getElementById('cloudOn');
    const cloudOffBtn = document.getElementById('cloudOff');
    const cloudSpeedSlider = document.getElementById('cloudSpeed');

    cloudOnBtn.addEventListener('click', () => {
      cloudEnabled = true; clouds.visible = true;
      cloudOnBtn.classList.add('active');
      cloudOffBtn.classList.remove('active');

    cloudOffBtn.addEventListener('click', () => {

      cloudOnBtn.classList.remove('active');

    let cloudRotationSpeed = 0.0005;
    cloudSpeedSlider.addEventListener('input', (e) => {
      cloudRotationSpeed = parseFloat(e.target.value);
      cloudSpeedVal.textContent = (cloudRotationSpeed * 1000).toFixed(1);
    });
    clouds.visible = true;

    // 星空（移动端减少数量）
    const starsGeometry = new THREE.BufferGeometry();
    const starsCount = STAR_COUNT;
    const starsPositions = new Float32Array(starsCount * 3);
    const starsColors = new Float32Array(starsCount * 3);
    for (let i = 0; i < starsCount * 3; i += 3) {
      const r = 900 + Math.random() * 1400;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      starsPositions[i] = Math.sin(phi) * Math.cos(theta) * r;
      starsPositions[i + 1] = Math.sin(phi) * Math.sin(theta) * r;
      starsPositions[i + 2] = Math.cos(phi) * r;
      const colorVal = 0.75 + Math.random() * 0.25;
      const colorChoice = Math.random();
      if (colorChoice < 0.7) {
        starsColors[i] = colorVal; starsColors[i+1] = colorVal * 0.95; starsColors[i+2] = colorVal;
      } else if (colorChoice < 0.85) {
        starsColors[i] = colorVal * 0.9; starsColors[i+1] = colorVal * 0.9; starsColors[i+2] = colorVal;
      } else {
        starsColors[i] = colorVal; starsColors[i+1] = colorVal * 0.9; starsColors[i+2] = colorVal * 0.7;
      }
    }
    starsGeometry.setAttribute('position', new THREE.BufferAttribute(starsPositions, 3));
    starsGeometry.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
    const starsMaterial = new THREE.PointsMaterial({
      size: IS_MOBILE ? 1.2 : 1.6, vertexColors: true, transparent: true, opacity: 1.0,
      blending: THREE.AdditiveBlending, sizeAttenuation: true
    });
    const stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);
    stars.rotation.y = 0.5;
    stars.rotation.x = 0.3;

    const originalStarsOpacity = starsMaterial.opacity;

    // ==================== 上传处理（移动端优化版） ====================
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileName');
    const resetBtn = document.getElementById('resetTexture');

    // 移动端专用的图片预处理，限制最大尺寸
    function prepareEquirectangularTexture(image, imgWidth, imgHeight) {
      const expectedRatio = 2;
      const actualRatio = imgWidth / imgHeight;
      let sourceX = 0, sourceY = 0, sourceW = imgWidth, sourceH = imgHeight;
      if (Math.abs(actualRatio - expectedRatio) > 0.01) {
        if (actualRatio > expectedRatio) {
          sourceW = imgHeight * expectedRatio;
          sourceX = (imgWidth - sourceW) / 2;
        } else {
          sourceH = imgWidth / expectedRatio;
          sourceY = (imgHeight - sourceH) / 2;
        }
      }
      
      // 移动端限制输出尺寸
      let outW = Math.round(sourceW);
      let outH = Math.round(sourceH);
      
      if (IS_MOBILE) {
        const maxW = MAX_TEXTURE_SIZE;
        const maxH = MAX_TEXTURE_SIZE / 2;
        if (outW > maxW || outH > maxH) {
          const scale = Math.min(maxW / outW, maxH / outH);
          outW = Math.floor(outW * scale);
          outH = Math.floor(outH * scale);
        }
      }
      
      // 使用 canvas 绘制并缩放
      const canvas = document.createElement('canvas');
      canvas.width = outW; 
      canvas.height = outH;
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'medium'; // 移动端使用 medium 平衡性能
      ctx.drawImage(image, sourceX, sourceY, sourceW, sourceH, 0, 0, outW, outH);
      return canvas;
    }

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const displayName = file.name.length > 16 ? file.name.substring(0, 14) + '...' : file.name;
      fileNameDisplay.textContent = '处理中...';
      
      if (window.createImageBitmap) {
        createImageBitmap(file, { imageOrientation: 'none', premultiplyAlpha: 'none', colorSpaceConversion: 'none' })
          .then(bitmap => {
            const canvas = prepareEquirectangularTexture(bitmap, bitmap.width, bitmap.height);
            const newTexture = new THREE.CanvasTexture(canvas);
            // 配置纹理
            newTexture.encoding = THREE.sRGBEncoding;
            newTexture.wrapS = THREE.RepeatWrapping;
            newTexture.wrapT = THREE.RepeatWrapping;
            if (IS_MOBILE || canvas.width > 2048) {
              newTexture.minFilter = THREE.LinearFilter;
              newTexture.generateMipmaps = false;
            } else {
              newTexture.minFilter = THREE.LinearMipmapLinearFilter;
              newTexture.generateMipmaps = true;
            }
            newTexture.anisotropy = IS_MOBILE ? 2 : maxAnisotropy;
            newTexture.needsUpdate = true;
            
            if (currentTexture && currentTexture.image instanceof HTMLCanvasElement) currentTexture.dispose();
            phongMaterial.map = newTexture;
            phongMaterial.needsUpdate = true;
            basicMaterial.map = newTexture;
            basicMaterial.needsUpdate = true;
            currentTexture = newTexture;
            fileNameDisplay.textContent = displayName;
            bitmap.close();
          }).catch(err => {
            console.warn('createImageBitmap 失败，回退到 FileReader', err);
            loadViaFileReader(file, displayName);
          });
      } else {
        loadViaFileReader(file, displayName);
      }
    });

    function loadViaFileReader(file, displayName) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = prepareEquirectangularTexture(img, img.width, img.height);
          const newTexture = new THREE.CanvasTexture(canvas);
          newTexture.encoding = THREE.sRGBEncoding;
          newTexture.wrapS = THREE.RepeatWrapping;
          newTexture.wrapT = THREE.RepeatWrapping;
          if (IS_MOBILE || canvas.width > 2048) {
            newTexture.minFilter = THREE.LinearFilter;
            newTexture.generateMipmaps = false;
          } else {
            newTexture.minFilter = THREE.LinearMipmapLinearFilter;
            newTexture.generateMipmaps = true;
          }
          newTexture.anisotropy = IS_MOBILE ? 2 : maxAnisotropy;
          newTexture.needsUpdate = true;
          if (currentTexture && currentTexture.image instanceof HTMLCanvasElement) currentTexture.dispose();
          phongMaterial.map = newTexture;
          phongMaterial.needsUpdate = true;
          basicMaterial.map = newTexture;
          basicMaterial.needsUpdate = true;
          currentTexture = newTexture;
          fileNameDisplay.textContent = displayName;
        };
        img.onerror = () => { fileNameDisplay.textContent = '图片加载失败'; };
        img.src = e.target.result;
        fileNameDisplay.textContent = '处理中...';
      };
      reader.readAsDataURL(file);
    }

    resetBtn.addEventListener('click', () => {
      fileNameDisplay.textContent = '加载中...';
      loadDefaultTexture((tex) => {
        if (tex) {

          phongMaterial.map = tex;
          phongMaterial.needsUpdate = true;
          basicMaterial.map = tex;
          basicMaterial.needsUpdate = true;
          currentTexture = tex;
          fileInput.value = '';

          fileNameDisplay.textContent = '默认纹理不可用';
        }
      });

    // ==================== 视角控制 ====================
    const btnResetView = document.getElementById('btnResetView');
    const btnAutoRotate = document.getElementById('btnAutoRotate');
    const btnZoomIn = document.getElementById('btnZoomIn');
    const btnZoomOut = document.getElementById('btnZoomOut');
    const miniGlobe = document.getElementById('miniGlobe');

    let autoRotateEnabled = false;

    const LON_OFFSET = 145;
    const TARGET_LAT = 35;
    const TARGET_LON = 105;
    const VIEW_DISTANCE = 3.5;

    function resetView() {
      const latRad = THREE.MathUtils.degToRad(TARGET_LAT);
      const lonRad = THREE.MathUtils.degToRad(TARGET_LON + LON_OFFSET);
      const x = Math.cos(latRad) * Math.cos(lonRad) * VIEW_DISTANCE;
      const y = Math.sin(latRad) * VIEW_DISTANCE;
      const z = Math.cos(latRad) * Math.sin(lonRad) * VIEW_DISTANCE;
      camera.position.set(x, y, z);
      controls.target.set(0, 0, 0);
      controls.update();
    }

    resetView();

    btnResetView.addEventListener('click', resetView);
    miniGlobe.addEventListener('click', resetView);

    // ==================== 面板显示/隐藏 & 拖动 ====================

    // 默认隐藏设置面板（移动端避免遮挡）
    geoSettings.classList.add('hidden');

    function toggleSettings() {
      const isHidden = geoSettings.classList.toggle('hidden');
      if (isHidden) {
        gpuBadge.classList.add('hidden');
      } else {
        gpuBadge.classList.remove('hidden');
      }
    }
    closeSettings.addEventListener('click', toggleSettings);
    btnSideSettings.addEventListener('click', toggleSettings);

    (function makePanelDraggable() {
      let isDragging = false;
      let startX = 0, startY = 0;
      let startLeft = 0, startTop = 0;

      settingsPanelTitle.addEventListener('mousedown', (e) => {
        if (e.target === closeSettings || e.target.closest('.close-x')) return;
        
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        const rect = geoSettings.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        
        geoSettings.style.right = 'auto';
        geoSettings.style.left = startLeft + 'px';
        geoSettings.style.top = startTop + 'px';
        geoSettings.style.transition = 'none';
        
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        let newLeft = startLeft + dx;
        let newTop = startTop + dy;
        
        const panelWidth = geoSettings.offsetWidth;
        const panelHeight = geoSettings.offsetHeight;
        const maxLeft = window.innerWidth - panelWidth;
        const maxTop = window.innerHeight - panelHeight;
        
        newLeft = Math.max(0, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));
        
        geoSettings.style.left = newLeft + 'px';
        geoSettings.style.top = newTop + 'px';
      });

      document.addEventListener('mouseup', () => {
        if (isDragging) {
          isDragging = false;
          geoSettings.style.transition = '';
        }
      });
      
      // 触摸支持
      settingsPanelTitle.addEventListener('touchstart', (e) => {
        if (e.target === closeSettings || e.target.closest('.close-x')) return;
        const touch = e.touches[0];
        isDragging = true;
        startX = touch.clientX;
        startY = touch.clientY;
        
        const rect = geoSettings.getBoundingClientRect();
        startLeft = rect.left;
        startTop = rect.top;
        
        geoSettings.style.right = 'auto';
        geoSettings.style.left = startLeft + 'px';
        geoSettings.style.top = startTop + 'px';
        geoSettings.style.transition = 'none';
        
        e.preventDefault();
      }, { passive: false });
      
      document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - startX;
        const dy = touch.clientY - startY;
        
        let newLeft = startLeft + dx;
        let newTop = startTop + dy;
        
        const panelWidth = geoSettings.offsetWidth;
        const panelHeight = geoSettings.offsetHeight;
        const maxLeft = window.innerWidth - panelWidth;
        const maxTop = window.innerHeight - panelHeight;
        
        newLeft = Math.max(0, Math.min(newLeft, maxLeft));
        newTop = Math.max(0, Math.min(newTop, maxTop));
        
        geoSettings.style.left = newLeft + 'px';
        geoSettings.style.top = newTop + 'px';
        e.preventDefault();
      }, { passive: false });
      
      document.addEventListener('touchend', () => {
        if (isDragging) {
          isDragging = false;
          geoSettings.style.transition = '';
        }
      });
    })();

    document.getElementById('btnSideLayers').addEventListener('click', () => {
      fileInput.click();
    });

    // 比例尺
    function updateScale() {
      const dist = camera.position.length();
      const scaleVal = Math.round(dist * 400);
      document.getElementById('geoScale').textContent = `${scaleVal.toLocaleString()} 公里`;
      const level = Math.max(1, Math.round((8 - dist) * 2));
      document.getElementById('statusLevel').textContent = level;
    }

    // ==================== 实时缩略图（移动端更低分辨率） ====================
    const miniCanvas = document.getElementById('miniGlobeCanvas');
    miniCanvas.width = MINI_SIZE;
    miniCanvas.height = MINI_SIZE;

    const miniScene = new THREE.Scene();
    miniScene.background = new THREE.Color(0x0a0e18);

    const miniCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
    miniCamera.position.set(0, 0, 3.6);
    miniCamera.lookAt(0, 0, 0);

    const miniRenderer = new THREE.WebGLRenderer({
      canvas: miniCanvas, antialias: false, alpha: false, precision: 'mediump'
    });
    miniRenderer.setSize(MINI_SIZE, MINI_SIZE);
    miniRenderer.setPixelRatio(1);
    miniRenderer.outputEncoding = THREE.sRGBEncoding;
    miniRenderer.toneMapping = THREE.NoToneMapping;
    miniRenderer.setClearColor(0x0a0e18, 1);

    const miniEarthMaterial = new THREE.MeshBasicMaterial({ map: null });
    // 缩略图使用低模球体
    const miniGeometry = new THREE.SphereGeometry(1, 32, 32, 0, Math.PI * 2, 0, Math.PI);
    const miniEarth = new THREE.Mesh(miniGeometry, miniEarthMaterial);
    miniScene.add(miniEarth);

    function updateMiniGlobe() {
      if (currentTexture) {
        miniEarthMaterial.map = currentTexture;
        miniEarthMaterial.needsUpdate = true;
      }
      const mainDir = camera.position.clone().normalize();
      if (mainDir.length() < 0.01) mainDir.set(0, 0, 1);
      miniCamera.position.copy(mainDir.multiplyScalar(3.6));
      miniCamera.lookAt(0, 0, 0);
      miniRenderer.render(miniScene, miniCamera);
    }

    // ==================== 动画 ====================
    let miniFrameCounter = 0;
    let lastTime = performance.now();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const now = performance.now();
      const delta = now - lastTime;
      lastTime = now;
      
      const dist = camera.position.length();
      const minD = controls.minDistance;
      const maxD = controls.maxDistance;
      const s = Math.max(0, Math.min(1, (dist - minD) / (maxD - minD)));
      controls.rotateSpeed = ROTATE_SPEED_NEAR + s * (ROTATE_SPEED_FAR - ROTATE_SPEED_NEAR);
      controls.zoomSpeed = ZOOM_SPEED_NEAR + s * (ZOOM_SPEED_FAR - ZOOM_SPEED_NEAR);
      
      if (cloudEnabled && clouds.visible) {
        clouds.rotation.y += cloudRotationSpeed * (delta / 16);
      }
      stars.rotation.y += 0.00001 * (delta / 16);
      
      if (sunHalo1.visible) {
        const pulse = 1 + Math.sin(Date.now() * 0.0015) * 0.03;
        sunHalo1.scale.set(pulse, pulse, pulse);
        sunHalo2.scale.set(pulse * 0.99, pulse * 0.99, pulse * 0.99);
        sunHalo3.scale.set(pulse * 0.98, pulse * 0.98, pulse * 0.98);
      }
      
      if (lightMode === 'sun') {
        starsMaterial.opacity = originalStarsOpacity * 0.75;
      } else {
        starsMaterial.opacity = originalStarsOpacity;
      }
      
      controls.update();
      updateScale();
      
      if (usePostProcessing && composer) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
      
      miniFrameCounter++;
      // 移动端降低缩略图更新频率
      const updateInterval = IS_MOBILE ? 3 : 2;
      if (miniFrameCounter % updateInterval === 0) {
        updateMiniGlobe();
      }
    }
    animate();

    window.addEventListener('resize', () => { resizeRenderer(); });
  </script>
</body>
</html>
